<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile — CodeNudge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-app">

  <!-- TOP NAVBAR -->
  <nav class="navbar app-navbar">
    <div class="nav-inner">
      <a href="/dashboard.html" class="brand">
        <span class="brand-icon">🔔</span>
        <span class="brand-name">CodeNudge</span>
      </a>

      <div class="nav-links">
        <a href="/dashboard.html" class="nav-link">← Back to Dashboard</a>
      </div>

      <div class="nav-user-area">
        <a href="/notifications.html" class="nav-notif-btn" id="notif-badge-btn" title="View Notifications">
          <span class="bell-icon">🔔</span>
          <span class="notif-pill" id="unread-pill" style="display:none;">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container profile-layout">
    <div id="profile-container" class="profile-card glass-card">
      <div class="loading-spinner">Loading developer profile...</div>
    </div>

    <!-- NUDGE HISTORY FOR THIS USER -->
    <div class="section-card glass-card" id="profile-history-card">
      <h3>Nudges Sent to this Developer</h3>
      <div id="user-nudge-history" class="history-list">
        <p class="empty-state">No reminders sent to this person yet. Be the first to nudge them!</p>
      </div>
    </div>
  </main>

  <!-- REMINDER MODAL -->
  <div id="reminder-modal" class="modal-backdrop" style="display:none;">
    <div class="modal-dialog glass-card">
      <div class="modal-header">
        <div class="modal-user-target">
          <span class="target-avatar" id="modal-target-avatar">🧑‍💻</span>
          <div>
            <h4>Remind <span id="modal-target-name">Friend</span></h4>
            <span class="target-username" id="modal-target-username">@friend</span>
          </div>
        </div>
        <button class="modal-close" id="close-modal-btn">✕</button>
      </div>

      <form id="profile-nudge-form">
        <input type="hidden" id="modal-target-id" />

        <div class="form-group">
          <label>Select Motivation Type <span class="req">*</span></label>
          <div class="motivation-selector">
            <label class="motiv-option">
              <input type="radio" name="motivation" value="roast" checked />
              <div class="motiv-box">
                <span class="m-icon">😤</span>
                <strong>Savage Roast</strong>
                <small>Stop Netflix right now</small>
              </div>
            </label>

            <label class="motiv-option">
              <input type="radio" name="motivation" value="tamil_audio" />
              <div class="motiv-box highlight-audio">
                <span class="m-icon">🎵</span>
                <strong>Hey Parama Padi Da!</strong>
                <small>Plays audio motivation</small>
              </div>
            </label>

            <label class="motiv-option">
              <input type="radio" name="motivation" value="career" />
              <div class="motiv-box">
                <span class="m-icon">💼</span>
                <strong>Career Push</strong>
                <small>Interviews are coming</small>
              </div>
            </label>

            <label class="motiv-option">
              <input type="radio" name="motivation" value="friendly" />
              <div class="motiv-box">
                <span class="m-icon">🤝</span>
                <strong>Friendly Push</strong>
                <small>Let's solve together</small>
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="modal-custom-message">Personalized Message</label>
          <textarea id="modal-custom-message" class="form-textarea" rows="3" placeholder="Write a motivating reminder..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-send-btn">Send Nudge 🔔</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
