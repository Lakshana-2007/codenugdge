<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — CodeNudge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-auth">
  <div class="auth-wrapper">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <span class="brand-icon">🔔</span>
          <span class="brand-name">CodeNudge</span>
        </a>
        <h2>Welcome Back</h2>
        <p>Log in to motivate your fellow devs & check your nudges</p>
      </div>

      <div id="auth-alert" class="alert-box" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. rahul@test.com" required autocomplete="email" />
          <span class="input-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
          <span class="input-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">
          Log In 🚀
        </button>
      </form>

      <div class="auth-demo-hint">
        <p><strong>Quick Demo Accounts (Password: <code>password123</code>):</strong></p>
        <div class="demo-chips">
          <button type="button" class="demo-chip" onclick="fillDemo('rahul@test.com')">🧑‍💻 Rahul</button>
          <button type="button" class="demo-chip" onclick="fillDemo('priya@test.com')">👩‍💻 Priya</button>
          <button type="button" class="demo-chip" onclick="fillDemo('arjun@test.com')">🧑‍🎓 Arjun</button>
          <button type="button" class="demo-chip" onclick="fillDemo('sneha@test.com')">👩‍🔬 Sneha</button>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign Up here</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'password123';
    }
  </script>
</body>
</html>
