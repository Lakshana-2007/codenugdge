<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CodeNudge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-auth">
  <div class="auth-wrapper">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <span class="brand-icon">🔔</span>
          <span class="brand-name">CodeNudge</span>
        </a>
        <h2>Join CodeNudge</h2>
        <p>Set up your profile to receive and send coding reminders</p>
      </div>

      <div id="auth-alert" class="alert-box" style="display:none;"></div>

      <form id="register-form" novalidate>
        <!-- STEP 1: Basic Information -->
        <div id="reg-step-1" class="form-step">
          <div class="step-indicator">
            <span class="step-badge active">Step 1 of 2</span>
            <span class="step-title">Basic Info</span>
          </div>

          <div class="form-group">
            <label for="reg-name">Full Name <span class="req">*</span></label>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Rahul Sharma" required />
            <span class="input-error" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-username">Username <span class="req">*</span></label>
            <input type="text" id="reg-username" class="form-input" placeholder="e.g. rahul_codes" required />
            <span class="input-error" id="username-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address <span class="req">*</span></label>
            <input type="email" id="reg-email" class="form-input" placeholder="e.g. rahul@test.com" required autocomplete="email" />
            <span class="input-error" id="email-error"></span>
          </div>

          <button type="button" class="btn btn-primary btn-block" id="btn-next-step">
            Next: Security & Profile →
          </button>
        </div>

        <!-- STEP 2: Password, Avatar, Bio -->
        <div id="reg-step-2" class="form-step" style="display:none;">
          <div class="step-indicator">
            <span class="step-badge active">Step 2 of 2</span>
            <span class="step-title">Security & Preferences</span>
          </div>

          <div class="form-group">
            <label for="reg-avatar">Choose Your Avatar</label>
            <div class="avatar-picker" id="avatar-picker">
              <button type="button" class="avatar-opt active" data-avatar="🧑‍💻">🧑‍💻</button>
              <button type="button" class="avatar-opt" data-avatar="👩‍💻">👩‍💻</button>
              <button type="button" class="avatar-opt" data-avatar="🧑‍🎓">🧑‍🎓</button>
              <button type="button" class="avatar-opt" data-avatar="👩‍🔬">👩‍🔬</button>
              <button type="button" class="avatar-opt" data-avatar="🧑‍🚀">🧑‍🚀</button>
              <button type="button" class="avatar-opt" data-avatar="👩‍🎨">👩‍🎨</button>
              <button type="button" class="avatar-opt" data-avatar="⚡">⚡</button>
              <button type="button" class="avatar-opt" data-avatar="🔥">🔥</button>
            </div>
            <input type="hidden" id="reg-avatar" value="🧑‍💻" />
          </div>

          <div class="form-group">
            <label for="reg-bio">Short Bio / Status</label>
            <input type="text" id="reg-bio" class="form-input" placeholder="e.g. DSA grinder | Sleep deprived | Java lover" maxlength="120" />
          </div>

          <div class="form-group">
            <label for="reg-password">Password <span class="req">*</span></label>
            <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" />
            <span class="input-error" id="password-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password">Confirm Password <span class="req">*</span></label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password" />
            <span class="input-error" id="confirm-password-error"></span>
          </div>

          <div class="step-buttons-row">
            <button type="button" class="btn btn-ghost" id="btn-prev-step">
              ← Back
            </button>
            <button type="submit" class="btn btn-primary" id="btn-register-submit" style="flex:1;">
              Create Account 🎉
            </button>
          </div>
        </div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Log in here</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
